name: build-hook-dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la libhook.xcodeproj 2>/dev/null || true

      - name: Build dylib (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project libhook.xcodeproj \
            -target libhook \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/out" \
            OBJROOT="$(pwd)/out/obj" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -80

      - name: Locate dylib
        run: |
          echo "--- out 目录 ---"
          find out -name "*.dylib" -print 2>/dev/null || true
          echo "--- 全局搜索 ---"
          find . -name "libhook.dylib" -print 2>/dev/null || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libhook-dylib
          path: |
            out/Release-iphoneos/libhook.dylib
            out/**/libhook.dylib
          if-no-files-found: error
