name: build-hook-dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build dylib (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project libhook.xcodeproj \
            -target libhook \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -80

      - name: Locate dylib
        run: |
          find build -name "*.dylib" -maxdepth 6 -print
          DYLIB=$(find build -name "libhook.dylib" -maxdepth 6 | head -1)
          echo "DYLIB=$DYLIB"
          ls -lh "$DYLIB"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libhook-dylib
          path: build/Build/Products/Release-iphoneos/libhook.dylib
          if-no-files-found: error
