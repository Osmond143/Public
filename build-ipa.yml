name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project VEspProbe.xcodeproj \
            -scheme VEspProbe \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -50

      - name: Locate .app
        working-directory: app
        run: |
          find build -name "*.app" -maxdepth 6 -print

      - name: Package IPA
        working-directory: app
        run: |
          APP=$(find build -name "VEspProbe.app" -maxdepth 6 | head -1)
          echo "APP=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -r VEspProbe.ipa Payload
          ls -lh VEspProbe.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VEspProbe-ipa
          path: app/out/VEspProbe.ipa
          if-no-files-found: error
