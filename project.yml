name: libhook

options:
  bundleIdPrefix: com.vesp
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"
    CLANG_ENABLE_OBJC_ARC: "YES"
    SKIP_INSTALL: "YES"

targets:
  libhook:
    type: library.dynamic
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: libhook
        PRODUCT_BUNDLE_IDENTIFIER: com.vesp.hook
        MACH_O_TYPE: mh_dylib
        DYLIB_INSTALL_NAME_BASE: "@executable_path"
        LD_DYLIB_INSTALL_NAME: "@executable_path/libhook.dylib"
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
